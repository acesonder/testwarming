<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Homeless Outreach Platform</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="container">
    <h1>Forgot Password</h1>
    <p class="subtitle">Enter your email to receive a password reset link</p>
    
    <div id="alert" class="alert hidden"></div>
    
    <form id="forgotPasswordForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      
      <button type="submit" id="submitBtn">Send Reset Link</button>
    </form>
    
    <div class="link">
      <a href="/login">Back to login</a>
    </div>
  </div>
  
  <script src="/js/utils.js"></script>
  <script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      
      const formData = {
        email: document.getElementById('email').value
      };
      
      try {
        const data = await apiRequest('/api/auth/forgot-password', {
          method: 'POST',
          body: JSON.stringify(formData)
        });
        
        // Show success message with reset link (for development)
        let message = data.message;
        if (data.resetUrl) {
          message += ` <br><br><strong>For testing:</strong> <a href="${data.resetUrl}">Click here to reset password</a>`;
        }
        
        showAlert(message, 'success');
        document.getElementById('forgotPasswordForm').reset();
      } catch (error) {
        showAlert(error.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>

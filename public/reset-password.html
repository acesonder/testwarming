<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Homeless Outreach Platform</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="container">
    <h1>Reset Password</h1>
    <p class="subtitle">Enter your new password</p>
    
    <div id="alert" class="alert hidden"></div>
    
    <form id="resetPasswordForm">
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" name="newPassword" required minlength="8">
        <small style="color: #666; font-size: 12px;">Minimum 8 characters</small>
      </div>
      
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8">
      </div>
      
      <button type="submit" id="submitBtn">Reset Password</button>
    </form>
    
    <div class="link">
      <a href="/login">Back to login</a>
    </div>
  </div>
  
  <script src="/js/utils.js"></script>
  <script>
    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    if (!token) {
      showAlert('Invalid or missing reset token', 'error');
      document.getElementById('submitBtn').disabled = true;
    }
    
    document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (newPassword !== confirmPassword) {
        showAlert('Passwords do not match', 'error');
        return;
      }
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting...';
      
      try {
        const data = await apiRequest('/api/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({
            token: token,
            newPassword: newPassword
          })
        });
        
        showAlert(data.message + ' Redirecting to login...', 'success');
        
        setTimeout(() => {
          window.location.href = '/login';
        }, 2000);
      } catch (error) {
        showAlert(error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>

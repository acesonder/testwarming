<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Management - Homeless Outreach Platform</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="container wide">
    <div class="header">
      <div>
        <h1>👥 Client Management</h1>
        <div class="user-info">
          <strong id="userName"></strong> | <span id="userRole"></span>
        </div>
      </div>
      <div style="display: flex; gap: 10px;">
        <button onclick="window.location.href='/messages'" class="logout-btn btn-secondary" title="Messages">
          💬 Messages <span id="unreadBadge" class="badge-notification" style="display: none;">0</span>
        </button>
        <button onclick="window.location.href='/dashboard'" class="logout-btn btn-secondary">Dashboard</button>
        <button onclick="logout()" class="logout-btn">Logout</button>
      </div>
    </div>
    
    <div id="alert" class="alert hidden"></div>
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <div style="flex: 1; max-width: 400px;">
        <input type="text" id="searchInput" placeholder="Search clients by name or phone..." style="margin-bottom: 0;">
      </div>
      <button onclick="showAddClientModal()" class="btn-primary" style="width: auto; padding: 12px 30px;">
        ➕ Add New Client
      </button>
    </div>
    
    <table id="clientsTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Date of Birth</th>
          <th>Phone</th>
          <th>Email</th>
          <th>City</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="clientsTableBody">
        <tr>
          <td colspan="8" style="text-align: center;">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <!-- Add Client Modal -->
  <div id="addClientModal" class="modal" style="display: none;">
    <div class="modal-content">
      <span class="close" onclick="closeAddClientModal()">&times;</span>
      <h2>Add New Client</h2>
      <form id="addClientForm" onsubmit="handleAddClient(event)">
        <div class="form-row">
          <div class="form-group">
            <label>First Name *</label>
            <input type="text" name="firstName" required>
          </div>
          <div class="form-group">
            <label>Last Name *</label>
            <input type="text" name="lastName" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" name="dateOfBirth">
          </div>
          <div class="form-group">
            <label>Gender</label>
            <select name="gender">
              <option value="">Select...</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="non-binary">Non-binary</option>
              <option value="other">Other</option>
              <option value="prefer-not-to-say">Prefer not to say</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" name="phone">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="email">
          </div>
        </div>
        <div class="form-group">
          <label>Address</label>
          <input type="text" name="address">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>City</label>
            <input type="text" name="city">
          </div>
          <div class="form-group">
            <label>State</label>
            <input type="text" name="state" maxlength="2">
          </div>
          <div class="form-group">
            <label>Zip Code</label>
            <input type="text" name="zipCode" maxlength="10">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Emergency Contact Name</label>
            <input type="text" name="emergencyContactName">
          </div>
          <div class="form-group">
            <label>Emergency Contact Phone</label>
            <input type="tel" name="emergencyContactPhone">
          </div>
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea name="notes" rows="3"></textarea>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button type="submit" class="btn-primary">Create Client</button>
          <button type="button" onclick="closeAddClientModal()" class="btn-secondary">Cancel</button>
        </div>
      </form>
    </div>
  </div>
  
  <script src="/js/utils.js"></script>
  <script>
    let allClients = [];
    
    // Check authentication
    if (!requireAuth()) {
      // Will redirect to login
    } else {
      const user = getCurrentUser();
      if (user) {
        document.getElementById('userName').textContent = `${user.firstName} ${user.lastName}`;
        document.getElementById('userRole').textContent = user.role.charAt(0).toUpperCase() + user.role.slice(1);
        loadClients();
        loadUnreadCount();
      }
    }
    
    // Search functionality
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase();
      const filteredClients = allClients.filter(client => 
        client.first_name.toLowerCase().includes(searchTerm) ||
        client.last_name.toLowerCase().includes(searchTerm) ||
        (client.phone && client.phone.includes(searchTerm))
      );
      displayClients(filteredClients);
    });
    
    async function loadClients() {
      try {
        const data = await apiRequest('/api/clients');
        allClients = data.clients;
        displayClients(allClients);
      } catch (error) {
        showAlert('Failed to load clients', 'error');
        document.getElementById('clientsTableBody').innerHTML = '<tr><td colspan="8" style="text-align: center;">Failed to load clients</td></tr>';
      }
    }
    
    function displayClients(clients) {
      const tbody = document.getElementById('clientsTableBody');
      
      if (clients.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No clients found</td></tr>';
        return;
      }
      
      tbody.innerHTML = clients.map(client => `
        <tr onclick="window.location.href='/clients/${client.id}'" style="cursor: pointer;">
          <td>${client.id}</td>
          <td><strong>${client.first_name} ${client.last_name}</strong></td>
          <td>${client.date_of_birth ? new Date(client.date_of_birth).toLocaleDateString() : 'N/A'}</td>
          <td>${client.phone || 'N/A'}</td>
          <td>${client.email || 'N/A'}</td>
          <td>${client.city || 'N/A'}</td>
          <td><span class="badge badge-${client.is_active ? 'active' : 'inactive'}">${client.is_active ? 'Active' : 'Inactive'}</span></td>
          <td onclick="event.stopPropagation()">
            <button onclick="window.location.href='/clients/${client.id}'" class="btn-primary btn-sm">View Profile</button>
          </td>
        </tr>
      `).join('');
    }
    
    function showAddClientModal() {
      document.getElementById('addClientModal').style.display = 'flex';
    }
    
    function closeAddClientModal() {
      document.getElementById('addClientModal').style.display = 'none';
      document.getElementById('addClientForm').reset();
    }
    
    async function handleAddClient(event) {
      event.preventDefault();
      
      const formData = new FormData(event.target);
      const clientData = Object.fromEntries(formData.entries());
      
      try {
        await apiRequest('/api/clients', {
          method: 'POST',
          body: JSON.stringify(clientData)
        });
        
        showAlert('Client created successfully', 'success');
        closeAddClientModal();
        loadClients();
      } catch (error) {
        showAlert(error.message || 'Failed to create client', 'error');
      }
    }
    
    async function loadUnreadCount() {
      try {
        const data = await apiRequest('/api/messages/unread-count');
        if (data.unreadCount > 0) {
          const badge = document.getElementById('unreadBadge');
          badge.textContent = data.unreadCount;
          badge.style.display = 'inline-block';
        }
      } catch (error) {
        console.error('Failed to load unread count:', error);
      }
    }
  </script>
</body>
</html>
